# Edit this file, then run: uv run tfm4mario prepare / train / play
# Relative paths resolve beside this file, not the shell's working directory.

[paths]
selected_data = "processed_data/metadata_cache" # Cached win/fail trajectories; preparation selects level 1-3 only.
context = "artifacts/context-1-3-v4-stride2.npz"
model = "artifacts/policy-1-3-v4-stride2"
evaluation = "artifacts/heldout-v4.npz"
rollout = "artifacts/rollout-1-3-42-v4-stride2" # Choose a new directory for each run.
adaptive_rollout = "artifacts/adapt-1-3-42-v4-stride2" # One trace/video per adaptive episode.
online_cache = "artifacts/online-replay-1-3-v4-stride2.npz" # Bounded persistent experience.

[runtime]
device = "auto" # "cpu", "cuda", or "auto"; check with: uv run tfm4mario doctor
seed = 42

[prepare]
outcome = "all" # Both outcomes provide per-action value examples.
stride = 2 # Keep every second teacher decision; temporal inputs still use adjacent frames.
max_rows = 50000
head_rows_per_trajectory = 16 # Prefer each trajectory's opening wait-to-move transition.
pre_death_frames = 30 # Half a second at 60 FPS; detected pre-death actions receive -1.
label_offset = 1 # RAM[f] is post-action state; predict the action for frame f+1.
include_level = "1-3"
ram_encoding = "dataset-cr" # Repairs the source dataset's CR expansion bug.

[train]
n_estimators = 1
fit_mode = "fit_with_cache" # Alternatives: "fit_preprocessors", "low_memory".
# model_path = "/path/to/tabpfn-v3.5-20260909.safetensors" # Optional offline checkpoint.

[predict]
ram = "artifacts/ram.bin" # Raw 2048-byte dump from your emulator.
# To use a dataset PNG instead, remove ram above and uncomment:
# png = "processed_data/episode/original_frame_name.win.png"
ram_encoding = "dataset-cr" # Only applies to PNG trailers, never raw dumps.

[evaluate]
batch_size = 128

[play]
env_id = "SuperMarioBros-1-3-v0"
episodes = 1
max_frames = 18000
action_repeat = 1 # Increasing this changes control behavior; start at one.
action_selection = "epsilon_greedy"
epsilon = 0.10 # Explore only when maximum model confidence is below 0.50.
confidence_threshold = 0.50
render = false # true for a local display, false on a headless server.
record_video = true # Write episode-000.mp4 without opening a display.
video_fps = 60 # NES playback rate; model inference latency is not encoded.

[adapt]
env_id = "SuperMarioBros-1-3-v0"
episodes = 5 # Policy is frozen within each episode and refit once between episodes.
max_frames = 18000
action_repeat = 1
action_selection = "epsilon_greedy"
epsilon = 0.10 # Explore only when maximum model confidence is below 0.50.
confidence_threshold = 0.50
online_capacity = 256 # Recent unique useful rows; neutral no-op self-loops are discarded.
pre_death_frames = 30
render = false
record_video = true
video_fps = 60

[doctor]
# Uncomment after installing the game extra to check RAM access and stepping:
env_id = "SuperMarioBros-1-3-v0"
